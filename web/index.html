<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        // Paint the canvas before CSS/JS so a saved light theme does not flash black.
        // Boot snapshot is written by ThemeContext.applyStoredTheme (zeroclaw-theme-boot).
        try {
          var boot = null;
          try {
            boot = JSON.parse(localStorage.getItem("zeroclaw-theme-boot") || "null");
          } catch (e) {}
          if (!boot || (boot.scheme !== "light" && boot.scheme !== "dark") || typeof boot.bg !== "string") {
            var stored = null;
            try {
              stored = JSON.parse(localStorage.getItem("zeroclaw-theme") || "null");
            } catch (e2) {}
            var mode = stored && stored.theme;
            var light =
              mode === "light" ||
              (mode === "system" &&
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches);
            boot = {
              scheme: light ? "light" : "dark",
              bg: light ? "#f6f7f9" : "#0c0e12",
            };
          }
          var root = document.documentElement;
          root.style.colorScheme = boot.scheme;
          root.style.backgroundColor = boot.bg;
          root.style.setProperty("--pc-bg-base", boot.bg);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", boot.scheme);
        } catch (e3) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/_app/logo.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="ZeroClaw Blog RSS Feed"
      href="/blog/rss.xml"
    />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="ZeroClaw Blog Atom Feed"
      href="/blog/atom.xml"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>数智疾控</title>
  </head>
  <body>
    <div
      id="unsupported-browser"
      style="display:none;margin:2rem auto;max-width:720px;padding:1rem 1.25rem;border:1px solid #7f1d1d;border-radius:0.75rem;background:#1f1414;color:#fecaca;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;"
    >
      当前浏览器可能无法完整体验工作台。请使用 Chrome 111+、Edge 111+、Firefox 113+ 或 Safari 16.2+。
    </div>
    <div id="root"></div>
    <script>
      (function () {
        // Keep probes in sync with web/src/lib/browserSupport.ts.
        function supportsColorMix() {
          if (typeof CSS === "undefined" || typeof CSS.supports !== "function") {
            return false;
          }
          try {
            return (
              CSS.supports("color: color-mix(in srgb, #f00 50%, #00f)") ||
              CSS.supports("color", "color-mix(in srgb, #f00 50%, #00f)") ||
              CSS.supports("color: color-mix(in srgb, red 50%, blue)") ||
              CSS.supports("color", "color-mix(in srgb, red 50%, blue)")
            );
          } catch (e) {
            return false;
          }
        }
        if (typeof structuredClone !== "function") {
          try {
            window.structuredClone = function (value) {
              return JSON.parse(JSON.stringify(value));
            };
          } catch (e2) {}
        }
        var banner = document.getElementById("unsupported-browser");
        if (!supportsColorMix() && banner) {
          banner.style.display = "block";
        }
      })();
    </script>
    <script>
      // Load the parent/child bridge only when this page is framed or opened as a popup.
      if (window.parent !== window || window.opener) {
        document.write('<script src="/_app/iframe-bridge.js"><' + '/script>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
