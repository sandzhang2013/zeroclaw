# daemon 的 secret 注入 drop-in（daemon unit 由 `zeroclaw service install` 生成）。
# 用法：把本文件放到 ~/.config/systemd/user/zeroclaw.service.d/secret.conf，
# 或用 `systemctl --user edit zeroclaw.service` 手动粘贴下面两行。
# 不要提交真实 secret。

[Service]
Environment=ZEROCLAW_gateway__trusted_proxy=true
Environment=ZEROCLAW_gateway__trusted_proxy_secret=<与BFF相同的长随机串>
